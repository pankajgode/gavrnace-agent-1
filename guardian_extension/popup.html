<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 280px;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: white;
    }
    h2 {
      color: #00d4ff;
      margin: 0 0 10px 0;
      font-size: 16px;
    }
    .ai-list {
      margin: 10px 0;
    }
    .ai-item {
      background: #16213e;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      border-left: 3px solid #00d4ff;
    }
    .ai-name {
      font-weight: bold;
      color: #00d4ff;
    }
    .ai-url {
      font-size: 11px;
      color: #888;
      word-break: break-all;
    }
    .status {
      font-size: 12px;
      color: #4caf50;
    }
    .no-ai {
      color: #888;
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <h2>🛡️ Guardian AI Detector</h2>
  <div id="aiList" class="ai-list">
    <div class="no-ai">🔍 Scanning for AI tools...</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
